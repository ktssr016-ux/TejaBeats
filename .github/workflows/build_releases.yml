name: TejaBeats Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare Android Release Assets
        run: |
          mkdir -p release_assets
          find build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} release_assets/ \;
          if [ -f release_assets/app-release.apk ]; then
            cp release_assets/app-release.apk release_assets/TejaBeats-Android.apk
          elif [ -f release_assets/app-universal-release.apk ]; then
            cp release_assets/app-universal-release.apk release_assets/TejaBeats-Android.apk
          fi

      - name: Upload Android Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TejaBeats-Android-APK
          path: release_assets/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Windows Release Bundle
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_assets
          if (Test-Path "build\windows\x64\runner\Release") {
            Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "release_assets\TejaBeats-Windows.zip" -Force
          } elseif (Test-Path "build\windows\runner\Release") {
            Compress-Archive -Path "build\windows\runner\Release\*" -DestinationPath "release_assets\TejaBeats-Windows.zip" -Force
          }

      - name: Upload Windows Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets\TejaBeats-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TejaBeats-Windows-ZIP
          path: release_assets/TejaBeats-Windows.zip

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (.ipa)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r TejaBeats-iOS.ipa Payload
          mkdir -p release_assets
          mv TejaBeats-iOS.ipa release_assets/

      - name: Upload iOS Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/TejaBeats-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TejaBeats-iOS-IPA
          path: release_assets/TejaBeats-iOS.ipa


